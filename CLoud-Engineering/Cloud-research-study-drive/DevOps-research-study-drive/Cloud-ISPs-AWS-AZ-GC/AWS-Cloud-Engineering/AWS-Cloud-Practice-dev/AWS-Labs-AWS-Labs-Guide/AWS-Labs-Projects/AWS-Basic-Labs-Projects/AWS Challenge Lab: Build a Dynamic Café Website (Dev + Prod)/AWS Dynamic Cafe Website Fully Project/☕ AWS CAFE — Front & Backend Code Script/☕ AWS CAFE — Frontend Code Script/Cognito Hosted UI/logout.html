<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Charlie Café ☕ | Logged Out</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =========================================================
     CHARLIE CAFÉ — LOGOUT PAGE
     ---------------------------------------------------------
     ✔ Clears local access_token
     ✔ Redirects to Cognito logout endpoint
     ✔ Returns here after Cognito logout
     ✔ Uses config.js + central-auth.js
========================================================= -->

<!-- ===================== BOOTSTRAP ===================== -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ===================== GOOGLE FONT ===================== -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085')
                no-repeat center center/cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.overlay {
    background: rgba(0,0,0,0.65);
    position: absolute;
    width: 100%;
    height: 100%;
}

.logout-card {
    position: relative;
    background: rgba(58,37,28,0.95);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    width: 350px;
    text-align: center;
    color: #fff;
    z-index: 2;
}

.logo {
    font-size: 40px;
    margin-bottom: 10px;
}

.cafe-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 20px;
}

.btn-login {
    background: linear-gradient(135deg,#ff5722,#ff9800);
    border: none;
    border-radius: 50px;
    padding: 12px;
    font-weight: 600;
    width: 100%;
    color: #fff;
    transition: 0.3s;
}

.btn-login:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="logout-card">
    <div class="logo">☕</div>
    <div class="cafe-title">Charlie Café</div>
    <h4 class="mb-3">You’ve been logged out!</h4>
    <p class="mb-4">Thanks for visiting. See you again soon ☕</p>
    <a href="login.html" class="btn btn-login">Back to Login</a>
</div>

<!-- =========================================================
     LOAD CENTRAL MODULES
========================================================= -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/central-auth.js"></script>

<script>
/* =========================================================
   CHARLIE CAFÉ — LOGOUT FLOW
   ---------------------------------------------------------
   STEP 1:
   - Clear local token
   - Redirect to Cognito logout

   STEP 2:
   - Cognito redirects back here
   - Show styled page
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);
    const loggedOut = params.get("loggedout");

    // If NOT yet logged out from Cognito → redirect
    if (!loggedOut) {

        // Remove local access token
        localStorage.removeItem("access_token");

        // Build Cognito logout URL using config.js
        const logoutRedirect =
            window.location.origin + "/logout.html?loggedout=true";

        const logoutUrl =
            `https://${CHARLIE_CONFIG.COGNITO_DOMAIN}/logout` +
            `?client_id=${CHARLIE_CONFIG.CLIENT_ID}` +
            `&logout_uri=${encodeURIComponent(logoutRedirect)}`;

        window.location.href = logoutUrl;
    }

});
</script>

</body>
</html>
