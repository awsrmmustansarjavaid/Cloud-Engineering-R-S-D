<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie Café ☕ | Menu Price List</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<!-- Custom Styles -->
<style>
    body {
        background-color: #f5f5f5;
        font-family: 'Segoe UI', sans-serif;
    }
    .menu-header {
        text-align: center;
        margin: 30px 0;
        color: #6f4e37; /* Coffee brown */
    }
    .menu-card {
        border-radius: 15px;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }
    .menu-card:hover {
        transform: scale(1.05);
    }
    .drink-icon {
        font-size: 2rem;
        color: #ff9800;
    }
    .price {
        font-weight: bold;
        font-size: 1.2rem;
        color: #333;
    }
</style>
</head>
<body>

<!-- Page Header -->
<div class="container">
    <h1 class="menu-header">☕ Charlie Café | Menu Price List</h1>

    <!-- Menu Items Grid -->
    <div class="row g-4 justify-content-center">

        <!-- Coffee -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="menu-card text-center">
                <i class="bi bi-cup-fill drink-icon"></i>
                <h5 class="mt-2">Coffee</h5>
                <p class="price">$3</p>
            </div>
        </div>

        <!-- Tea -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="menu-card text-center">
                <i class="bi bi-cup-fill drink-icon"></i>
                <h5 class="mt-2">Tea</h5>
                <p class="price">$2</p>
            </div>
        </div>

        <!-- Latte -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="menu-card text-center">
                <i class="bi bi-cup-straw drink-icon"></i>
                <h5 class="mt-2">Latte</h5>
                <p class="price">$4</p>
            </div>
        </div>

        <!-- Cappuccino -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="menu-card text-center">
                <i class="bi bi-cup-hot drink-icon"></i>
                <h5 class="mt-2">Cappuccino</h5>
                <p class="price">$4</p>
            </div>
        </div>

        <!-- Fresh Juice -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="menu-card text-center">
                <i class="bi bi-cup-straw drink-icon"></i> <!-- Using cup-fill icon for juice -->
                <h5 class="mt-2">Fresh Juice</h5>
                <p class="price">$5</p>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
