<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Charlie Café ☕ | Unified Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =====================================================
     BOOTSTRAP + ICONS (COMMON)
===================================================== -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<!-- =====================================================
     STYLES
     - Orders Dashboard styles → dashboard.html
     - HR Dashboard styles → admin-dashboard.html
===================================================== -->
<style>
/* ===== COMMON ===== */
body {
    background-color: #0f0f10;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    display: none; /* 🔐 hidden until auth */
}

/* ===== SIDEBAR (MERGED & UNIFIED) ===== */
.sidebar {
    width: 250px;
    background: #151515;
    min-height: 100vh;
    position: fixed;
    padding: 20px;
}
.sidebar a {
    display: block;
    color: #bbb;
    padding: 12px;
    border-radius: 10px;
    text-decoration: none;
    margin-bottom: 8px;
    cursor: pointer;
}
.sidebar a:hover,
.sidebar a.active {
    background: #ff9800;
    color: #000;
}

/* ===== MAIN ===== */
.main {
    margin-left: 260px;
    padding: 25px;
}

/* ===== KPI CARDS (FROM ORDER DASHBOARD) ===== */
.kpi-card {
    border-radius: 20px;
    padding: 20px;
    color: white;
}
.bg-green { background: #1abc9c; }
.bg-purple { background: #9b59b6; }
.bg-blue { background: #3498db; }
.bg-orange { background: #e67e22; }

/* ===== TABLE CONTAINER ===== */
.table-container {
    margin-top: 30px;
    background: #1c1c1e;
    border-radius: 15px;
    padding: 20px;
}

/* ===== SECTIONS ===== */
.section { display: none; }
.section.active { display: block; }
</style>
</head>

<body>

<!-- =====================================================
     SIDEBAR (MERGED)
     - Navigation controls which section is visible
===================================================== -->
<div class="sidebar">
    <h4>☕ Charlie Café</h4>
    <p class="text-muted">Admin Dashboard</p>

    <!-- From dashboard.html -->
    <a class="active" onclick="showSection('orders')">
        <i class="bi bi-bag-check"></i> Orders
    </a>

    <!-- From admin-dashboard.html -->
    <a onclick="showSection('hr')">
        <i class="bi bi-people"></i> HR / Attendance
    </a>

    <hr>
    <a id="logoutBtn"><i class="bi bi-box-arrow-left"></i> Logout</a>
</div>

<!-- =====================================================
     MAIN CONTENT
===================================================== -->
<div class="main">

<!-- =====================================================
     🛒 ORDERS DASHBOARD SECTION
     SOURCE: dashboard.html
===================================================== -->
<div id="orders" class="section active">

    <h4>Orders Dashboard</h4>

    <!-- KPI CARDS -->
    <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="kpi-card bg-green"><h6>Sales</h6><h3 id="sales">0</h3></div></div>
        <div class="col-md-3"><div class="kpi-card bg-purple"><h6>Orders</h6><h3 id="ordersCount">0</h3></div></div>
        <div class="col-md-3"><div class="kpi-card bg-blue"><h6>Drinks</h6><h3 id="drinksCount">0</h3></div></div>
        <div class="col-md-3"><div class="kpi-card bg-orange"><h6>Avg</h6><h3 id="avgPrice">$0</h3></div></div>
    </div>

    <!-- ORDERS TABLE -->
    <div class="table-container">
        <h5>Latest Orders</h5>
        <table class="table table-hover text-white">
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Table</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>

</div>

<!-- =====================================================
     👥 HR / ATTENDANCE DASHBOARD SECTION
     SOURCE: admin-dashboard.html
===================================================== -->
<div id="hr" class="section">

    <h4>HR & Attendance Dashboard</h4>

    <!-- SUMMARY CARDS -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-success text-white p-3">
                <h6>Total Present</h6>
                <h3 id="card-present">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-danger text-white p-3">
                <h6>Total Absent</h6>
                <h3 id="card-absent">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-warning text-dark p-3">
                <h6>Total Leaves</h6>
                <h3 id="card-leaves">0</h3>
            </div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="mb-3">
        <button class="btn btn-outline-primary" onclick="loadSummary('daily')">Daily</button>
        <button class="btn btn-outline-primary" onclick="loadSummary('weekly')">Weekly</button>
        <button class="btn btn-outline-primary" onclick="loadSummary('monthly')">Monthly</button>
    </div>

    <!-- TABLE -->
    <table class="table table-bordered text-white">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Date</th>
                <th>Check-In</th>
                <th>Check-Out</th>
            </tr>
        </thead>
        <tbody id="attendance-body"></tbody>
    </table>

</div>

</div>

<!-- =====================================================
     CENTRAL AUTH & API (MANDATORY)
===================================================== -->
<script src="js/central-auth-api.js"></script>

<script>
/* =====================================================
   🔐 AUTH GUARD (COMMON)
===================================================== */
CHARLIE.auth.protectPage();
CHARLIE.auth.setupLogoutButton();
document.body.style.display = "block";

/* =====================================================
   🧭 SECTION NAVIGATION
===================================================== */
function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    event.target.classList.add('active');
}

/* =====================================================
   🛒 ORDERS DASHBOARD LOGIC
   SOURCE: dashboard.html
===================================================== */
async function loadOrdersDashboard() {
    const data = await CHARLIE.api.getDashboardMetrics("today");

    sales.innerText = `$${data.sales}`;
    ordersCount.innerText = data.orders;
    drinksCount.innerText = data.drinks;
    avgPrice.innerText = `$${data.avg}`;

    ordersTable.innerHTML = "";
    data.latest_orders.forEach(o => {
        ordersTable.innerHTML += `
            <tr>
                <td>${o.customer_name || "Anonymous"}</td>
                <td>${o.item}</td>
                <td>${o.quantity}</td>
                <td>${o.table_number || "-"}</td>
                <td>${o.date}</td>
            </tr>`;
    });
}

/* =====================================================
   👥 HR DASHBOARD LOGIC
   SOURCE: admin-dashboard.html
===================================================== */
async function loadSummary(type) {
    const data = await CHARLIE.secureFetch(
        `${CHARLIE.apiBase}/admin/attendance?type=${type}`
    );

    card-present.textContent = data.summary.total_present;
    card-absent.textContent = data.summary.total_absent;
    card-leaves.textContent = data.summary.total_leaves;

    attendance-body.innerHTML = "";
    data.attendance.forEach(r => {
        attendance-body.innerHTML += `
            <tr>
                <td>${r.name}</td>
                <td>${r.date}</td>
                <td>${r.checkin_time || "-"}</td>
                <td>${r.checkout_time || "-"}</td>
            </tr>`;
    });
}

/* =====================================================
   🚀 INITIAL LOAD
===================================================== */
loadOrdersDashboard();
loadSummary("daily");
</script>

</body>
</html>
