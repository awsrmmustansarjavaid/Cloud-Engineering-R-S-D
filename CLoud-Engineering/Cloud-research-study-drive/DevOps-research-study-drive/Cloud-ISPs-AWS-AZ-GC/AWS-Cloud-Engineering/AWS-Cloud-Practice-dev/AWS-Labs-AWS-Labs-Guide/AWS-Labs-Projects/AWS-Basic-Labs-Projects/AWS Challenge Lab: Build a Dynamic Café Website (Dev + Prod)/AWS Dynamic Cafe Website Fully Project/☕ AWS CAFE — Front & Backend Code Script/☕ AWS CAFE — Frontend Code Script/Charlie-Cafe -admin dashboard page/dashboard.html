<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Charlie Cafe ☕ | Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ================= BOOTSTRAP ================= -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
/* ================= GLOBAL STYLES (UNCHANGED) ================= */
body {
    background-color: #0f0f10;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
}
.sidebar { width: 250px; background: #151515; min-height: 100vh; position: fixed; padding: 20px; }
.sidebar a { display: block; color: #bbb; padding: 12px; border-radius: 10px; text-decoration: none; margin-bottom: 8px; }
.sidebar a:hover, .sidebar a.active { background: #ff9800; color: #000; }
.main { margin-left: 260px; padding: 25px; }
.card-dark { background: #1c1c1e; border-radius: 20px; padding: 20px; }
.kpi-card { border-radius: 20px; padding: 20px; color: white; }
.bg-green { background: #1abc9c; }
.bg-purple { background: #9b59b6; }
.bg-blue { background: #3498db; }
.bg-orange { background: #e67e22; }
.table-container { margin-top: 30px; background: #1c1c1e; border-radius: 15px; padding: 20px; }
#spinnerOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,15,16,0.8);
    display: none; justify-content: center; align-items: center; z-index: 9999;
}
#spinnerOverlay .spinner-border { width: 4rem; height: 4rem; color: #ff9800; }
#metricsChart { margin-top: 20px; background: #1c1c1e; border-radius: 15px; padding: 20px; }
</style>
</head>

<body style="display:none"><!-- hidden until auth passes -->

<!-- ================= DASHBOARD ================= -->
<div id="dashboard-container">

<!-- SIDEBAR (UNCHANGED) -->
<div class="sidebar">
    <h4>☕ Charlie Cafe</h4>
    <p class="text-muted">Dashboard</p>
    <a class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="#"><i class="bi bi-cup-hot"></i> Menu</a>
    <a href="order-status.html"><i class="bi bi-bag-check"></i> Orders</a>
    <a href="analytics.html" class="admin-only"><i class="bi bi-graph-up"></i> Analytics</a>
    <a href="#" class="admin-only"><i class="bi bi-gear"></i> Settings</a>
    <hr>
    <a class="logout-btn" style="cursor:pointer"><i class="bi bi-box-arrow-left"></i> Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h5>Welcome 👋</h5>
    <div>
        <small class="text-muted">Role:</small>
        <strong id="roleLabel">Admin</strong>
    </div>
</div>

<!-- FILTER -->
<div class="d-flex gap-3 mb-4 flex-wrap">
    <label class="mt-2">Filter:</label>
    <select id="dateFilter" class="form-select w-auto">
        <option value="today">Today</option>
        <option value="week">Last 7 Days</option>
        <option value="month">This Month</option>
    </select>
    <button class="btn btn-warning" onclick="printSummary()">🖨 Print Today Summary</button>
</div>

<!-- KPI CARDS -->
<div class="row g-4 mb-4">
    <div class="col-md-3"><div class="kpi-card bg-green"><h6>Sales</h6><h3 id="sales">0</h3></div></div>
    <div class="col-md-3"><div class="kpi-card bg-purple"><h6>Orders</h6><h3 id="ordersCount">0</h3></div></div>
    <div class="col-md-3"><div class="kpi-card bg-blue"><h6>Drinks</h6><h3 id="drinksCount">0</h3></div></div>
    <div class="col-md-3"><div class="kpi-card bg-orange"><h6>Avg</h6><h3 id="avgPrice">$0</h3></div></div>
</div>

<!-- ORDERS TABLE -->
<div class="table-container">
    <h5>Latest Orders</h5>
    <table class="table table-hover text-white">
        <thead>
            <tr><th>Customer</th><th>Item</th><th>Qty</th><th>Table</th><th>Date</th></tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>
</div>

<!-- CHART -->
<div id="metricsChart">
    <canvas id="kpiChart" height="120"></canvas>
</div>

</div>
</div>

<!-- SPINNER -->
<div id="spinnerOverlay"><div class="spinner-border"></div></div>

<!-- ================= JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ================= CENTRAL AUTH & API ================= -->
<script src="/js/central-auth-api.js"></script>

<script>
/* ================= AUTH GUARD ================= */
CHARLIE.auth.protectPage();     // redirects to Cognito if not logged in
document.body.style.display = "block";

/* ================= ROLE HANDLING ================= */
if (localStorage.getItem("userRole") === "STAFF") {
    document.querySelectorAll(".admin-only").forEach(e => e.remove());
    document.getElementById("roleLabel").innerText = "Staff";
}

/* ================= DASHBOARD DATA ================= */
const spinner = document.getElementById("spinnerOverlay");
const salesEl = document.getElementById("sales");
const ordersEl = document.getElementById("ordersCount");
const drinksEl = document.getElementById("drinksCount");
const avgEl = document.getElementById("avgPrice");
const ordersTable = document.getElementById("ordersTable");

let chart;

async function fetchDashboardData() {
    spinner.style.display = "flex";
    try {
        const filter = document.getElementById("dateFilter").value;

        // 🔗 CENTRALIZED API CALL
        const data = await CHARLIE.api.getDashboardMetrics(filter);

        salesEl.innerText = `$${data.sales}`;
        ordersEl.innerText = data.orders;
        drinksEl.innerText = data.drinks;
        avgEl.innerText = `$${data.avg}`;

        ordersTable.innerHTML = "";
        data.latest_orders.forEach(o => {
            ordersTable.innerHTML += `
                <tr>
                    <td>${o.customer_name || 'Anonymous'}</td>
                    <td>${o.item}</td>
                    <td>${o.quantity}</td>
                    <td>${o.table_number || '-'}</td>
                    <td>${o.date}</td>
                </tr>`;
        });

    } catch (e) {
        console.error("Dashboard load failed", e);
    } finally {
        spinner.style.display = "none";
    }
}

fetchDashboardData();
setInterval(fetchDashboardData, 10000);

function printSummary() {
    window.print();
}
</script>

</body>
</html>
